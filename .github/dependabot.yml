version: 2

updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # SpotBugs 4.10+ needs Maven >= 3.8.9, local builds still use 3.8.7.
      - dependency-name: "com.github.spotbugs:spotbugs-maven-plugin"
        versions:
          - ">=4.10.0"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springdoc*"
      test:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
          - "tools.jackson*"
      logging:
        patterns:
          - "org.slf4j*"
          - "ch.qos.logback*"
          - "org.apache.logging.log4j*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
